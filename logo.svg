<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!--
    BROCAL - Logo pixel perfect
    Referencia: imagen oficial de Facebook
    Color: naranja vibrante #F07820
    Técnica: orejas = círculos grandes (primero), cabeza rect encima tapa el borde interno
  -->

  <!-- OREJA IZQUIERDA: círculo grande, tapado por dentro por el rect de la cabeza -->
  <circle cx="21" cy="33" r="23" fill="#F07820"/>

  <!-- OREJA DERECHA: espejo -->
  <circle cx="79" cy="33" r="23" fill="#F07820"/>

  <!-- CABEZA: rectángulo con bordes muy redondeados, dibujado encima de las orejas -->
  <rect x="28" y="25" width="44" height="70" rx="13" fill="#F07820"/>

  <!-- OJO IZQUIERDO -->
  <circle cx="41" cy="46" r="9"   fill="#FFFFFF"/>
  <circle cx="41" cy="46" r="3"   fill="#F07820"/>

  <!-- OJO DERECHO -->
  <circle cx="59" cy="46" r="9"   fill="#FFFFFF"/>
  <circle cx="59" cy="46" r="3"   fill="#F07820"/>

  <!-- BOCA: barra blanca rectangular (no línea fina — igual al original) -->
  <rect x="34" y="67" width="32" height="5.5" rx="2.5" fill="#FFFFFF"/>

  <!-- LENGUA: píldora blanca, levemente a la derecha del centro -->
  <rect x="54" y="67" width="13" height="19" rx="6.5" fill="#FFFFFF"/>

  <!-- SLIT DE LA LENGUA: línea naranja vertical centrada en la lengua -->
  <line x1="60.5" y1="69" x2="60.5" y2="84"
        stroke="#F07820" stroke-width="1.8" stroke-linecap="round"/>
</svg>
