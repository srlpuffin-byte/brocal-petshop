<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!--
    BROCAL LOGO — Pixel Perfect
    Referencia: imagen original proporcionada por el usuario (fondo blanco, alta res)

    Técnica:
    - 2 círculos grandes de oreja, centrados SOBRE las esquinas superiores de la cabeza
    - Se tocan en x=50 a la altura de sus centros → crea el hueco cóncavo natural entre orejas
    - El rect de cabeza (mismo color) cubre la base de los círculos y llena el cuerpo
    - Todo queda como una silueta unificada SIN fondo blanco (SVG = transparente)
  -->

  <!-- OREJA IZQUIERDA -->
  <circle cx="26" cy="22" r="24" fill="#F5A623"/>

  <!-- OREJA DERECHA (espejo) -->
  <circle cx="74" cy="22" r="24" fill="#F5A623"/>

  <!-- CABEZA: rect encima, mismo color, cubre la unión interior de ambas orejas -->
  <rect x="30" y="38" width="40" height="57" rx="10" fill="#F5A623"/>

  <!-- OJO IZQUIERDO: círculo blanco + pupila naranja -->
  <circle cx="41" cy="54" r="7.5" fill="#FFFFFF"/>
  <circle cx="41" cy="54" r="2.6" fill="#F5A623"/>

  <!-- OJO DERECHO -->
  <circle cx="59" cy="54" r="7.5" fill="#FFFFFF"/>
  <circle cx="59" cy="54" r="2.6" fill="#F5A623"/>

  <!-- BOCA: barra blanca rectangular horizontal -->
  <rect x="35" y="73" width="30" height="4"   rx="2" fill="#FFFFFF"/>

  <!-- LENGUA: píldora blanca centrada colgando de la boca -->
  <rect x="47" y="73" width="12" height="18"  rx="6" fill="#FFFFFF"/>

  <!-- SLIT DE LA LENGUA: línea naranja vertical -->
  <line x1="53" y1="75" x2="53" y2="89"
        stroke="#F5A623" stroke-width="1.7" stroke-linecap="round"/>
</svg>
