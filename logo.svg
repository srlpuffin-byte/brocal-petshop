<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Left Ear: arch going up and left, then down, very close to the head -->
  <path d="M 36,42 C 36,12 18,12 18,52" stroke="#E06A41" stroke-width="16" stroke-linecap="round" fill="none" />
  
  <!-- Right Ear: arch going up and right, then down, very close to the head -->
  <path d="M 64,42 C 64,12 82,12 82,52" stroke="#E06A41" stroke-width="16" stroke-linecap="round" fill="none" />
  
  <!-- Central Head -->
  <path d="M 32,95 L 32,45 A 18,18 0 0,1 68,45 L 68,95 Z" fill="#E06A41" />
  
  <!-- Left Eye -->
  <circle cx="42" cy="46" r="6.5" fill="#FFFFFF" />
  <circle cx="42" cy="46" r="2.2" fill="#E06A41" />
  
  <!-- Right Eye -->
  <circle cx="58" cy="46" r="6.5" fill="#FFFFFF" />
  <circle cx="58" cy="46" r="2.2" fill="#E06A41" />
  
  <!-- Mouth Line -->
  <line x1="36" y1="65" x2="64" y2="65" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Tongue -->
  <path d="M 53,65 L 53,82 A 4.5,4.5 0 0,0 62,82 L 62,65 Z" fill="#FFFFFF" />
  
  <!-- Tongue Slit -->
  <line x1="57.5" y1="65" x2="57.5" y2="84" stroke="#E06A41" stroke-width="1.5" stroke-linecap="round" />
</svg>
